<div *ngIf="loading">Loading…</div>
<div *ngIf="error">{{ error }}</div>

<div *ngIf="!loading && product">
  <h2>{{ product.name }} ({{ product.sku }})</h2>
  <div *ngIf="product.imageUrl" style="max-width:300px;margin:8px 0"><img [src]="product.imageUrl" alt="{{product.name}}" style="width:100%;border-radius:8px;object-fit:cover"/></div>
  <p>{{ product.description }}</p>
  <p><strong>Quantity:</strong> {{ product.quantity }}</p>
  <p><strong>Location:</strong> {{ product.location || '—' }}</p>

  <div style="margin-top:1rem;">
    <label>New Quantity:
      <input type="number" [(ngModel)]="quantityInput" />
    </label>
    <label style="margin-left:1rem;">Location:
      <input type="text" [(ngModel)]="locationInput" />
    </label>
    <button (click)="saveQuantity()">Save</button>
  </div>
</div>
